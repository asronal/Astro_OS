image boot.vfat {
	vfat {
		files = {
			"bcm2711-rpi-4-b.dtb",
			"bcm2711-rpi-400.dtb",
			"bcm2711-rpi-cm4.dtb",
			"bcm2711-rpi-cm4s.dtb",
			"rpi-firmware/astro-hardware.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/overlays",
			"rpi-firmware/start4.elf",
			"Image"
		}
	}

	size = 64M
}

# Grown to fill the boot disk on first boot by S05astro-storage
image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}

	size = 64M
}

image sdcard.img {
	hdimage {
		# cmdline.txt finds the root partition from this
		disk-signature = 0x41535452
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
