[core]
shell=kiosk
idle-time=0

[libinput]
touchscreen_calibrator=true

[autolaunch]
path=/usr/lib/astro/ui-app.sh
watch=true

# The chart is drawn in software, so don't ask a Pi to fill a 4K screen until that has
# been measured on one. A screen without this mode uses its preferred one instead.
[output]
name=HDMI-A-1
mode=1920x1080

[output]
name=HDMI-A-2
mode=1920x1080

# To rotate a display, add its connector name and a transform, for example:
# [output]
# name=DSI-1
# transform=rotate-180
